def getNodeCmd() {
  def configuredNode = providers.gradleProperty("NODE_BINARY").orNull
  if (configuredNode && new File(configuredNode).canExecute()) return configuredNode

  def nodeCmd = "node"
  try {
    def proc = [nodeCmd, "-v"].execute()
    proc.waitFor()
    if (proc.exitValue() == 0) return nodeCmd
  } catch (Exception ignored) {}

  def nvmDir = new File(System.getProperty("user.home") + "/.nvm/versions/node")
  def latestNvmNode = nvmDir.exists() ? nvmDir.listFiles()?.sort()?.last()?.getAbsolutePath() + "/bin/node" : null

  def candidatePaths = [
    "/opt/homebrew/bin/node",
    "/usr/local/bin/node",
    latestNvmNode,
    System.getProperty("user.home") + "/.fnm/current/bin/node",
    System.getProperty("user.home") + "/.asdf/shims/node",
    System.getProperty("user.home") + "/.volta/bin/node"
  ]
  for (path in candidatePaths) {
    if (path && new File(path).exists()) return path
  }
  return nodeCmd
}

def nodeCmd = getNodeCmd()
def nodeDir = new File(nodeCmd).getParent()
def nodeEnvMap = [:] + System.getenv()
if (nodeDir && !(nodeEnvMap.get("PATH") ?: "").contains(nodeDir)) {
  nodeEnvMap.put("PATH", nodeDir + File.pathSeparator + (nodeEnvMap.get("PATH") ?: ""))
}
def nodeEnv = nodeEnvMap.collect { k, v -> "${k}=${v}" }

def getRNMinorVersion(nodeCmd, nodeEnvMap) {
  def version = providers.exec {
    commandLine(nodeCmd, "-e", "console.log(require('react-native/package.json').version);")
    if (nodeEnvMap.get("PATH")) {
      environment("PATH", nodeEnvMap.get("PATH"))
    }
  }.standardOutput.asText.get().trim()

  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

  return minor
}

if (getRNMinorVersion(nodeCmd, nodeEnvMap) >= 75) {
  extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    if (System.getenv('EXPO_UNSTABLE_CORE_AUTOLINKING') == '1') {
      println('\u001B[32mUsing expo-modules-autolinking as core autolinking source\u001B[0m')
      def command = [
        nodeCmd,
        '--no-warnings',
        '--eval',
        'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
        'react-native-config',
        '--json',
        '--platform',
        'android'
      ].toList()
      ex.autolinkLibrariesFromCommand(command)
    } else {
      def command = [
        nodeCmd,
        '--no-warnings',
        '--eval',
        'require(\'@react-native-community/cli\').run()',
        'config'
      ].toList()
      ex.autolinkLibrariesFromCommand(command)
    }
  }
}

